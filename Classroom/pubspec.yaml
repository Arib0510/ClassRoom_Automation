name: smart_classroom_iot
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.10+11

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_blue_plus: 1.34.5
  network_info_plus: ^7.0.0
  connectivity_plus: ^7.3.1
  permission_handler: 11.3.1
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.5
  flutter_dotenv: ^5.2.1
  mqtt_client: ^10.14.0
  shared_preferences: ^2.3.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  dio: ^5.11.1
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env

  # Bundled so text renders identically offline and never reflows after a
  # late font download.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
