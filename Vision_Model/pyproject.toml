[build-system]
requires = ["setuptools>=75,<81", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-occupancy-vision"
version = "0.1.0"
description = "Four-zone CPU TFLite occupancy sensing and MQTT for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.24.2,<2", "Pillow>=9.4,<12", "PyYAML>=6.0,<7", "paho-mqtt==2.1.0"]

[project.scripts]
classroom-vision = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"
pythonpath = ["."]
markers = ["real_inference: explicitly opted-in integration tests using real model kernels"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
